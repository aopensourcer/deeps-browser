[package]
name = "deeps"
version = "0.1.0"
edition = "2021"
description = "A small, clean desktop browser: Rust shell, Next.js chrome"
build = "build.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.3"
include_dir = "0.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tao = "0.37"
url = "2"
ureq = { version = "2", features = ["tls"] }
wry = { version = "0.57", features = ["devtools"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
